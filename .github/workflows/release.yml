name: Android Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (must match version.properties, e.g. v0.1.0)'
        required: true
        type: string
        default: 'v0.1.0'
      prerelease:
        description: 'Mark GitHub Release as a pre-release'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Verify build and artifacts without publishing a GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  checks: write

jobs:
  release:
    name: Verify, Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$INPUT_TAG_NAME"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid SemVer release tag '$RELEASE_TAG'. Expected format vMAJOR.MINOR.PATCH (e.g. v0.1.0)."
            exit 1
          fi

          VERSION_STRIPPED="${RELEASE_TAG#v}"
          BASE_VERSION="${VERSION_STRIPPED%%-*}"

          # Read version.properties
          source <(grep -E '^(VERSION_MAJOR|VERSION_MINOR|VERSION_PATCH|VERSION_CODE)=' version.properties)
          EXPECTED_VERSION="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"

          if [ "$BASE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Tag version '$BASE_VERSION' does not match version.properties '$EXPECTED_VERSION'."
            exit 1
          fi

          IS_PRERELEASE="false"
          if [[ "$RELEASE_TAG" == *-* ]] || [ "$INPUT_PRERELEASE" = "true" ]; then
            IS_PRERELEASE="true"
          fi

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_STRIPPED}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Validated release tag ${RELEASE_TAG} (versionCode ${VERSION_CODE}, prerelease=${IS_PRERELEASE})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run static harness, tests, coverage, lint & release compile
        run: |
          bash harness.sh --static-only
          gradle :app:jacocoDebugUnitTestReport :app:lintDebug :app:compileReleaseKotlin --stacktrace

      - name: Publish JUnit release verification report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Release Verification Tests (${{ steps.version.outputs.release_tag }})
          path: app/build/test-results/testDebugUnitTest/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Build Android release artifacts (Signed with Debug Fallback)
        id: build_artifacts
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-artifacts

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_STORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release signing secrets detected. Building signed Release APK and AAB..."
            KEYSTORE_FILE="${RUNNER_TEMP}/upload-keystore.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"

            export KEYSTORE_PATH="$KEYSTORE_FILE"
            export STORE_PASSWORD="$ANDROID_STORE_PASSWORD"
            export KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

            gradle :app:assembleRelease :app:bundleRelease --stacktrace

            APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
            AAB_PATH=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | head -n 1)

            cp "$APK_PATH" "release-artifacts/agenda-widget-${VERSION}-release.apk"
            cp "$AAB_PATH" "release-artifacts/agenda-widget-${VERSION}-release.aab"
            if [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then
              cp "app/build/outputs/mapping/release/mapping.txt" "release-artifacts/agenda-widget-${VERSION}-mapping.txt"
            fi
            echo "signing_mode=signed-release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD) are not configured. Falling back to verified Debug APK."
            gradle :app:assembleDebug --stacktrace
            APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
            cp "$APK_PATH" "release-artifacts/agenda-widget-${VERSION}-debug-fallback.apk"
            echo "signing_mode=debug-fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up temporary keystore
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/upload-keystore.jks"

      - name: Generate SHA-256 checksums
        run: |
          (cd release-artifacts && sha256sum * > checksums-sha256.txt)
          cat release-artifacts/checksums-sha256.txt

      - name: Extract changelog release notes
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          SIGNING_MODE: ${{ steps.build_artifacts.outputs.signing_mode }}
        run: |
          python3 - <<'PY'
          import os, re
          base_version = os.environ["BASE_VERSION"]
          release_tag = os.environ["RELEASE_TAG"]
          signing_mode = os.environ["SIGNING_MODE"]

          notes = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              pattern = rf"^## \[{re.escape(base_version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
              match = re.search(pattern, content, flags=re.MULTILINE | re.DOTALL)
              if match:
                  notes = match.group(1).strip()

          if not notes:
              notes = f"Release {release_tag} of Agenda Widget."

          if signing_mode == "debug-fallback":
              notes += (
                  "\n\n> [!NOTE]\n"
                  "> This release was built in **debug fallback mode** because Play upload signing secrets "
                  "(`ANDROID_KEYSTORE_BASE64`, `ANDROID_STORE_PASSWORD`, `ANDROID_KEY_PASSWORD`) are not yet "
                  "configured in repository secrets. See `docs/RELEASE.md` to enable signed Release APK & AAB builds.\n"
              )

          with open("release-artifacts/checksums-sha256.txt", "r", encoding="utf-8") as cf:
              checksums = cf.read().strip()

          notes += f"\n\n### Artifact SHA-256 Checksums\n```text\n{checksums}\n```\n"

          with open("release-notes.md", "w", encoding="utf-8") as out:
              out.write(notes)
          PY

      - name: Upload release artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: agenda-widget-${{ steps.version.outputs.release_tag }}-artifacts
          path: |
            release-artifacts/*
            app/build/reports/jacoco/jacocoDebugUnitTestReport/
            app/build/reports/lint-results-debug.html
          retention-days: 30

      - name: Publish GitHub Release
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: Agenda Widget ${{ steps.version.outputs.release_tag }}
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: release-artifacts/*

      - name: Write Release Audit Summary
        if: always()
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SIGNING_MODE: ${{ steps.build_artifacts.outputs.signing_mode }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          {
            echo "## Release Summary: ${RELEASE_TAG}"
            echo ""
            echo "- **Version Name**: \`${VERSION}\`"
            echo "- **Version Code**: \`${VERSION_CODE}\`"
            echo "- **Signing Mode**: \`${SIGNING_MODE}\`"
            echo "- **Pre-release**: \`${IS_PRERELEASE}\`"
            echo "- **Dry Run**: \`${DRY_RUN}\`"
            echo ""
            echo "### Checksums"
            echo '```text'
            cat release-artifacts/checksums-sha256.txt || echo "No artifacts built"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
