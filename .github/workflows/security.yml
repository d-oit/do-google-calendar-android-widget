name: Security & CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC security scan
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  static-security-hygiene:
    name: Static Security & Privacy Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run static security & governance harness
        run: bash harness.sh --static-only

      - name: Verify backup exclusion rules and exported component hardening
        run: |
          grep -q 'calendar_widget_db' app/src/main/res/xml/backup_rules.xml
          grep -q 'calendar_widget_db' app/src/main/res/xml/data_extraction_rules.xml
          grep -q 'isMinifyEnabled = true' app/build.gradle.kts
          grep -q 'isShrinkResources = true' app/build.gradle.kts

  codeql-kotlin:
    name: CodeQL Analysis (Java / Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile Android Kotlin targets
        run: gradle :app:compileDebugKotlin :app:compileReleaseKotlin --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
